workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd cap_baseball_abs/cap_baseball_abs
          flutter pub get
      - name: Build APK
        script: |
          cd cap_baseball_abs/cap_baseball_abs
          flutter build apk --release --no-shrink
    artifacts:
      - cap_baseball_abs/cap_baseball_abs/build/app/outputs/flutter-apk/app-release.apk
